{% extends "layout.html" %}

{% load static %}

{% block css_files %}
    <link rel="stylesheet" href="{% static 'blog/post.css' %}">
    <link rel="stylesheet" href="{% static 'blog/includes/header.css' %}">
{% endblock %} 

{% block page_title %}
    {{ post|title }}
{% endblock %}

{% block content %}
                <li>
                    <article class="post">
                        <a href="{% url "post-detail-page" post.slug %}">
                            <img src="{% static 'blog/images/'|add:post.image %}" alt="{{ post.title }}"/>
                            <div class="post__content">
                                <h3>{{ post.title }}</h3>
                                <p>
                                    {{ post.excerpt }}
                                </p>
                            </div>
                        </a>
                    </article>
                </li>
{% endblock %}
